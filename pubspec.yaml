name: presensi_gac
description: A Flutter app for presensi (attendance) system.
publish_to: "none"

version: 1.1.3+3

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^7.0.2
  latlong2: ^0.9.0
  geolocator: ^12.0.0
  image_picker: ^1.0.4
  camera: ^0.11.0+1
  permission_handler: ^11.3.1
  path: ^1.9.0
  dio: ^5.3.0
  open_filex: ^4.3.2
  path_provider: ^2.1.2
  google_fonts: ^6.2.1
  http: ^1.1.1
  package_info_plus: ^8.0.0
  url_launcher: ^6.2.5
  shared_preferences: ^2.1.1
  cupertino_icons: ^1.0.5
  shimmer: ^3.0.0
  intl: ^0.20.2
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.13.1

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "assets/icon/background_icon.png"
  adaptive_icon_foreground: "assets/icon/foreground_icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/icon/
    - assets/images/
